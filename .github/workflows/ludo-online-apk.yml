name: Build Ludo Stable APK

on:
  push:
    branches:
      - ludo-online-apk-stable-build
    paths:
      - 'ludo-online-apk/**'
      - '.github/workflows/ludo-online-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Restore and validate bundled game
        run: |
          cat ludo-online-apk/app/src/main/assets/game.part1a ludo-online-apk/app/src/main/assets/game.part1b1a ludo-online-apk/app/src/main/assets/game.part1b1b ludo-online-apk/app/src/main/assets/game.part1b2 ludo-online-apk/app/src/main/assets/game.part2 ludo-online-apk/app/src/main/assets/game.part3 ludo-online-apk/app/src/main/assets/game.part4 ludo-online-apk/app/src/main/assets/game.part5 ludo-online-apk/app/src/main/assets/game.part6 > /tmp/ludo-game.b64
          test "$(wc -c < /tmp/ludo-game.b64)" -eq 31948
          base64 -d /tmp/ludo-game.b64 | gzip -d > ludo-online-apk/app/src/main/assets/launcher.html
          test "$(wc -c < ludo-online-apk/app/src/main/assets/launcher.html)" -eq 93236
          echo '26ed928cc5c850fadc1fe268f92dda2efa850ab68fb390503dae8d21028907cf  ludo-online-apk/app/src/main/assets/launcher.html' | sha256sum -c -
          grep -q 'VS COMPUTER' ludo-online-apk/app/src/main/assets/launcher.html
          grep -q 'PLAY WITH FRIENDS' ludo-online-apk/app/src/main/assets/launcher.html
          grep -q 'ONLINE PLAY' ludo-online-apk/app/src/main/assets/launcher.html

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK with Android Gradle Plugin
        working-directory: ludo-online-apk
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK archive
        run: unzip -t ludo-online-apk/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify zip alignment
        run: $ANDROID_HOME/build-tools/35.0.0/zipalign -c -v 4 ludo-online-apk/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify Android APK signatures
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs ludo-online-apk/app/build/outputs/apk/debug/app-debug.apk

      - name: Inspect package
        run: |
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging ludo-online-apk/app/build/outputs/apk/debug/app-debug.apk | head -20
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging ludo-online-apk/app/build/outputs/apk/debug/app-debug.apk | grep "package: name='com.ludoarena.akstable2026'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging ludo-online-apk/app/build/outputs/apk/debug/app-debug.apk | grep "sdkVersion:'21'"

      - name: Rename APK
        run: cp ludo-online-apk/app/build/outputs/apk/debug/app-debug.apk Ludo_Arena_Stable_Fixed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ludo_Arena_Stable_Fixed
          path: Ludo_Arena_Stable_Fixed.apk
          if-no-files-found: error
          retention-days: 7
