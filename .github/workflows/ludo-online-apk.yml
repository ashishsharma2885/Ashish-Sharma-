name: Build Ludo Online APK

on:
  push:
    branches:
      - ludo-online-apk-stable-build
    paths:
      - 'ludo-online-apk/**'
      - '.github/workflows/ludo-online-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: ludo-online-apk
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK archive
        run: unzip -t ludo-online-apk/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK signature
        run: jarsigner -verify -verbose -certs ludo-online-apk/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp ludo-online-apk/app/build/outputs/apk/debug/app-debug.apk Ludo_Arena_Online_Stable.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ludo_Arena_Online_Stable
          path: Ludo_Arena_Online_Stable.apk
          if-no-files-found: error
          retention-days: 7
