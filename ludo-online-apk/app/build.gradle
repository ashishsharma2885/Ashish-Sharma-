plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ludoarena.online'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ludoarena.akstable2026'
        minSdk 21
        targetSdk 35
        versionCode 3
        versionName '2.0.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
